<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gbhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Dark Rounded Hexagon -->
  <rect width="64" height="64" rx="16" fill="#060D1A" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Global Nexus Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#112544" stroke-width="2" />
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#0077B6" stroke-opacity="0.6" stroke-width="1.5" transform="rotate(-25 32 32)" />
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1.5" transform="rotate(45 32 32)" />
  
  <!-- Central Hub Core -->
  <circle cx="32" cy="32" r="7" fill="url(#gbhGrad)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />
  
  <!-- Connection Orbit Nodes -->
  <circle cx="16" cy="22" r="2.5" fill="#00E5FF" />
  <circle cx="48" cy="24" r="2.5" fill="#00E5FF" />
  <circle cx="44" cy="45" r="2.5" fill="#00B4D8" />
  <circle cx="20" cy="42" r="2.5" fill="#00E5FF" />
</svg>
